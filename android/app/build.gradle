plugins {
    id 'com.android.application'
}

android {
    namespace = "it.tankizzu.dw2003"
    compileSdkVersion 35
    defaultConfig {
        applicationId "it.tankizzu.dw2003"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 20
        versionName "1.7"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key for now: a test build to install by hand
            signingConfig signingConfigs.debug
        }
    }
    // libSDL3.so, libmain.so (android/loader.c) and libdw3.so (the game), copied here by tools/android/build_apk.sh
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError = false }
}
